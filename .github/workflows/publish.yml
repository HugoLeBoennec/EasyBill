name: Build installers

# Builds distributable installers with Electron Forge and attaches them to the
# workflow run. Nothing is published automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  make:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js and NPM
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Make installers (unsigned)
        run: npm run make

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: easybill-${{ matrix.os }}
          path: out/make
          if-no-files-found: error
